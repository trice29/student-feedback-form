<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Feedback Form</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>Student Feedback</h1>
    <p>Tell us about your experience.</p>
  </header>

  <main>

    <form id="feedbackForm" novalidate>

      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" required>
        <div class="error" id="fullNameError"></div>
      </div>

      <div class="form-group">
        <label for="studentEmail">Email Address</label>
        <input type="email" id="studentEmail" name="studentEmail" required>
        <div class="error" id="studentEmailError"></div>
      </div>

      <div class="form-group">
        <label for="course">Course Name</label>
        <input type="text" id="course" name="course" required>
        <div class="error" id="courseError"></div>
      </div>

      <div class="form-group">
        <label for="comments">Comments</label>
        <textarea id="comments" name="comments" rows="5" required></textarea>
        <div class="error" id="commentsError"></div>
      </div>

      <button type="submit">Send Feedback</button>

      <p id="successMessage" role="status"></p>

    </form>

    <section class="bonus">
      <h2>Bonus Feature</h2>

      <p>Get a random piece of advice from a public API.</p>

      <button type="button" id="adviceButton">
        Get Advice
      </button>

      <p id="adviceText" aria-live="polite"></p>

    </section>

  </main>

  <footer>
    <p>Student Feedback Project</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
